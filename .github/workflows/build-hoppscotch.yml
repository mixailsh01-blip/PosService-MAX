name: Build Hoppscotch (Pyrus login)

on:
  workflow_dispatch:
    inputs:
      apply_patch:
        description: Apply Pyrus patch (false = plain upstream, no push)
        default: 'true'
  push:
    branches: [main, feat/shared-library-training]
    paths:
      - hoppscotch-pyrus/**
      - .github/workflows/build-hoppscotch.yml

env:
  UPSTREAM_REPO: https://github.com/hoppscotch/hoppscotch.git
  UPSTREAM_SHA: 55908a7   # version the patch was made against

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Fetch upstream Hoppscotch and apply patch
        run: |
          git clone "$UPSTREAM_REPO" upstream
          cd upstream
          git checkout "$UPSTREAM_SHA"
          if [ "${{ github.event.inputs.apply_patch }}" != "false" ]; then
            git apply --check ../hoppscotch-pyrus/pyrus-login.patch
            git apply ../hoppscotch-pyrus/pyrus-login.patch
          fi

      - name: Test SPRT transport policy and SQLite access gate
        if: github.event.inputs.apply_patch != 'false'
        env:
          HOPPSCOTCH_SOURCE: ${{ github.workspace }}/upstream
        run: node --test hoppscotch-pyrus/policy.test.mjs

      - name: Create .env (needed by the frontend build)
        run: cp upstream/.env.example upstream/.env

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Image tags
        id: image
        run: |
          echo "immutable=ghcr.io/${OWNER}/hoppscotch-pyrus:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "latest=ghcr.io/${OWNER}/hoppscotch-pyrus:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/prod.Dockerfile
          target: aio
          push: ${{ github.event.inputs.apply_patch != 'false' }}
          tags: |
            ${{ steps.image.outputs.immutable }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
