<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Обучение · iiko</title>
<script>
  // Оформление берём у SPRT API (родительское окно): цвета темы, акцент, шрифт.
  // Если страница открыта отдельно, остаются значения по умолчанию из :root ниже.
  (function(){
    var MAP={'--bg':'--primary-color','--bg-1':'--primary-light-color','--bg-2':'--primary-dark-color',
      '--fg':'--secondary-dark-color','--fg-1':'--secondary-color','--fg-2':'--secondary-light-color',
      '--line':'--divider-dark-color','--line-2':'--divider-dark-color',
      '--accent':'--accent-color','--accent-2':'--accent-dark-color','--accent-fg':'--accent-contrast-color'};
    function apply(){
      try{
        var pd=parent.document; if(pd===document) return;
        var cs=parent.getComputedStyle(pd.documentElement), r=document.documentElement;
        for(var k in MAP){var v=cs.getPropertyValue(MAP[k]).trim(); if(v) r.style.setProperty(k,v);}
        var c=pd.documentElement.classList;
        r.classList.toggle('dark',c.contains('dark')||c.contains('black'));
        var ff=parent.getComputedStyle(pd.body).fontFamily; if(ff) r.style.setProperty('--font',ff);
      }catch(e){}
    }
    function fonts(){
      try{
        var css='';
        Array.prototype.forEach.call(parent.document.styleSheets,function(sh){
          try{Array.prototype.forEach.call(sh.cssRules,function(rule){ if(rule.type===5) css+=rule.cssText+'\n'; });}catch(e){}
        });
        if(css){var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);}
      }catch(e){}
    }
    apply(); fonts();
    try{new MutationObserver(apply).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class','data-accent','style']});}catch(e){}
  })();
</script>
<style>
  :root{--bg:#0f0f0f;--bg-1:#171717;--bg-2:#1f1f1f;--fg:#fafafa;--fg-1:#a3a3a3;--fg-2:#737373;--line:#262626;--line-2:#3a3a3a;
    --accent:#ef4444;--accent-2:#dc2626;--accent-fg:#fff;--ok:#22c55e;--err:#f87171;--warn:#f59e0b;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
  html.dark{color-scheme:dark}
  html:not(.dark){--err:#dc2626;--ok:#16a34a;--warn:#b45309}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font)!important;font-size:13px;line-height:1.55;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
  #app{max-width:1100px;margin:0 auto;padding:20px 28px 56px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  button{font:inherit;font-weight:600;font-size:13px;padding:8px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-1);color:var(--fg);cursor:pointer;transition:border-color .12s,background .12s,color .12s}
  button:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  button.primary:hover:not([disabled]){background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-fg)}
  button[disabled]{opacity:.4;cursor:not-allowed}
  button:focus-visible,input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--fg)}
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;resize:vertical}

  .ttl{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--fg-1);margin:0 0 16px}
  .prog{display:flex;align-items:center;gap:12px;margin:0 0 18px}
  .bar{flex:1;height:8px;border-radius:999px;background:var(--bg-2);overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .prog span{color:var(--fg-1);font-size:12px;white-space:nowrap}
  .pass{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:12px;padding:14px 18px;margin:0 0 18px}
  .pass b{display:block;font-size:15px;margin-bottom:2px}
  .pass .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  .steps{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
  .step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;background:var(--bg-1);border:1px solid var(--line);color:var(--fg);font-weight:600}
  .step .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-2);color:var(--fg-1);font-size:12px}
  .step.cur{border-color:var(--accent)}
  .step.done .n{background:var(--ok);color:#fff}
  .step.done .n:before{content:"✓"}
  .step.done .n span{display:none}
  .step.lock{opacity:.45}

  .card{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:22px}
  .card h2{margin:0 0 8px;font-size:18px;letter-spacing:-.01em}
  .card p{margin:8px 0}
  .info{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;margin:12px 0;color:var(--fg-1)}
  .info table{border-collapse:collapse;margin-top:4px}
  .info td{padding:2px 14px 2px 0}
  .form{margin-top:16px;display:grid;gap:12px}
  .reqline{display:grid;grid-template-columns:110px 1fr;gap:10px}
  .lbl{display:block;font-size:12px;font-weight:600;color:var(--fg-1);margin-bottom:4px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .resp{margin-top:18px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-right:8px}
  .badge.s2{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .badge.s4{background:color-mix(in srgb,var(--err) 18%,transparent);color:var(--err)}
  pre{margin:8px 0;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:auto;font-size:12px;line-height:1.5;max-height:340px}
  .verdict{margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line)}
  .verdict.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
  .verdict.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
  .verdict b{display:block;margin-bottom:2px}
  .nav{display:flex;justify-content:flex-end;margin-top:16px}
  .who{margin:-8px 0 14px;color:var(--fg-1);font-size:12px}
  .who b{color:var(--fg);font-weight:600}
  button.small{padding:5px 10px;font-size:12px;font-weight:500;white-space:nowrap}
  button.warnbtn{border-color:var(--err);color:var(--err)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// без кэша: после правки файлов достаточно обновить страницу
(function () {
  var v = Date.now(), list = ["sim.js", "tasks.js", "app.js"], i = 0;
  (function next() {
    if (i >= list.length) return;
    var el = document.createElement("script");
    el.src = list[i++] + "?v=" + v;
    el.onload = next;
    document.body.appendChild(el);
  })();
})();
</script>
</body>
</html>
